name: Refresh data and deploy site

on:
  schedule:
    - cron: "*/15 * * * *"     # every 15 min (GitHub may delay)
  workflow_dispatch:           # "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch live data (news, sports, weather, quotes, fun)
        run: node scripts/update.mjs
      - name: Commit refreshed data
        run: |
          git config user.name "wyatt-hq bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main || true
            git push origin HEAD:main || echo "push skipped"
          fi
      - uses: actions/configure-pages@v5
      - name: Package site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js .nojekyll css js data icons og _site/ 2>/dev/null || true
          V=$(date +%s)
          sed -i "s/v=BUILD/v=$V/g" _site/index.html _site/js/*.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
