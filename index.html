<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wyatt HQ</title>
<meta name="theme-color" content="#070b16">
<meta name="robots" content="noindex">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./css/app.css?v=BUILD">
<link rel="stylesheet" href="./css/v4.css?v=BUILD">
<style>
#boot{position:fixed;inset:0;z-index:300;background:radial-gradient(600px 420px at 50% 42%,#14224a 0%,#060a16 70%);display:grid;place-items:center;transition:opacity .24s ease,transform .24s ease,filter .24s ease,visibility .24s}
#boot.out{opacity:0;transform:scale(1.12);filter:blur(8px);visibility:hidden}
#boot .bw{display:flex;flex-direction:column;align-items:center;gap:14px}
#boot svg{width:112px;height:112px;overflow:visible;filter:drop-shadow(0 0 18px rgba(124,140,255,.55))}
#boot .trk{fill:none;stroke:rgba(255,255,255,.07);stroke-width:3}
#boot .arc{fill:none;stroke:url(#bgx);stroke-width:4;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transform:rotate(-90deg);transform-origin:60px 60px;animation:bsweep .34s cubic-bezier(.3,.7,.2,1) forwards}
#boot .w{fill:none;stroke:#fff;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;animation:bsweep .28s .06s cubic-bezier(.3,.7,.2,1) forwards}
#boot .pip{fill:#fff;opacity:0;animation:bpip .26s .26s ease-out forwards}
#boot .nm{display:flex;font:800 30px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.03em;color:#fff}
#boot .nm span,#boot .nm b{opacity:0;transform:translateY(10px);animation:brise .22s ease-out forwards}
#boot .nm span.sp{width:9px}
#boot .nm b{background:linear-gradient(120deg,#6ee7ff,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}
#boot .nm>*:nth-child(1){animation-delay:.08s}#boot .nm>*:nth-child(2){animation-delay:.11s}#boot .nm>*:nth-child(3){animation-delay:.14s}#boot .nm>*:nth-child(4){animation-delay:.17s}#boot .nm>*:nth-child(5){animation-delay:.2s}#boot .nm>*:nth-child(7){animation-delay:.23s}#boot .nm>*:nth-child(8){animation-delay:.26s}
@keyframes bsweep{to{stroke-dashoffset:0}}@keyframes brise{to{opacity:1;transform:none}}@keyframes bpip{0%{opacity:0;transform:scale(.2)}60%{opacity:1;transform:scale(1.8)}100%{opacity:0;transform:scale(3)}}
@media (prefers-reduced-motion:reduce){#boot *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
<link rel="stylesheet" href="./css/v5.css?v=BUILD">
</head>
<body>
<canvas id="bg"></canvas>
<div id="app"></div>
<div id="pal"><div class="box"><input type="text" placeholder="Type a command or tab… (Esc to close)" autocomplete="off"><ul></ul></div></div>
<div id="boot" aria-hidden="true"><div class="bw"><svg viewBox="0 0 120 120"><defs><linearGradient id="bgx" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ee7ff"/><stop offset=".55" stop-color="#7c8cff"/><stop offset="1" stop-color="#c084fc"/></linearGradient></defs><circle class="trk" cx="60" cy="60" r="50"/><circle class="arc" cx="60" cy="60" r="50" pathLength="100"/><polyline class="w" points="37,47 48.5,79 60,55 71.5,79 83,47" pathLength="100"/><circle class="pip" cx="60" cy="60" r="3"/></svg><div class="nm"><span>W</span><span>y</span><span>a</span><span>t</span><span>t</span><span class="sp"></span><b>H</b><b>Q</b></div></div></div>
<noscript>This dashboard needs JavaScript.</noscript>
<script type="module" src="./js/app.js?v=BUILD"></script>
</body>
</html>
